gui:
  skipRewordInEditorWarning: true
  nerdFontsVersion: "3"
  border: 'rounded'
os:
  editPreset: 'nvim' # see 'Configuring File Editing' section
git:
  pagers:
    - # delta
      colorArg: always
      pager: delta --paging=never --line-numbers
      # ydiff
      # colorArg: never
      # pager: ydiff -p cat -s --wrap --width={{columnWidth}}
  overrideGpg: true
