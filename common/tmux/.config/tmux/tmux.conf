#!/usr/bin/env bash

# Configure in-tmux terminal
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",$TERM:RGB"
set-option -g default-shell /bin/zsh

# Recommended Claude Code config (https://code.claude.com/docs/en/terminal-config#configure-tmux)
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Set indexes to start at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when re-ordering windows
set -g renumber-windows on

# Enable automatic window renaming
set-window-option -g automatic-rename on

# Disable zsh renaming (use front command)
set-option -g allow-rename off

# Move to next session when the active one is killed
set-option -g detach-on-destroy off

# Notify in-tmux terminal of pane focus
set-option -g focus-events on

# Configure status bar
set -g status-style "fg=#878580,bg=#1C1B1A"
set -g message-style "fg=#CECDC3,bg=#282726"
set-option -g status-position top
set -g status-justify left

# Set status length
set -g status-left-length 100
set -g status-right-length 100

# Configure status left & right messages
set -g status-left  "  #S  "
set -g status-right  "  #H "

# Configure tab formatting
setw -g window-status-separator "#[bg=#282726] "
setw -g window-status-format "#[fg=#878580,bg=#282726] #I #W "
setw -g window-status-current-format "#[fg=#100F0F,bg=#D0A215,bold] #I #W "

# Configure pane borders
set -g pane-border-style "fg=#403E3C,bg=default"
set -g pane-active-border-style "fg=#D0A215,bg=default"
set -g pane-border-lines single
set -g pane-border-status off

# Enabled mouse support
set -g mouse on

# Use vim keybindings while in copy-mode
setw -g mode-keys vi

# Immediately fire escape key
set -sg escape-time 0

# Use vim-like `v` for selection and `y` for yank in copy-mode
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Sort session/window chooser by name like tmux versions ≤ 2.9a did
bind-key -T prefix s choose-tree -Zs -O name
bind-key -T prefix w choose-tree -Zw -O name

# Popup bindings
# bind -n C-g popup -E -w80% -h80% -d '#{pane_current_path}' "lazygit"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-pain-control'

set -g @plugin 'mrjones2014/smart-splits.nvim'

set -g @smart-splits_move_left_key  'C-h'
set -g @smart-splits_move_right_key 'C-l'
set -g @smart-splits_move_down_key  'C-j'
set -g @smart-splits_move_up_key    'C-k'

set -g @smart-splits_resize_left_key  'C-left'
set -g @smart-splits_resize_right_key 'C-right'
set -g @smart-splits_resize_down_key  'C-down'
set -g @smart-splits_resize_up_key    'C-up'

set -g @smart-splits_resize_step_size '5'

set -g @plugin 'sainnhe/tmux-fzf'
TMUX_FZF_SESSION_FORMAT="#{session_windows} windows"
bind -n C-s run-shell -b "$XDG_CONFIG_HOME/tmux/plugins/tmux-fzf/scripts/session.sh switch"

set -g @plugin 'YlanAllouche/tmux-task-monitor'

set -g @plugin 'rickstaa/tmux-notify'

set -g @plugin 'eduwass/tmux-palette'
set -g @palette-key 'C-Space'
set -g @palette-find-pane-key 'M-f'
set -g @palette-move-pane-key 'M-m'

set -g @plugin 'Ataraxy-Labs/opensessions'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'opencode claude lazygit opensessions opensessions-si'

run '~/.tmux/plugins/tpm/tpm'
