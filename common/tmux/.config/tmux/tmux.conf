# ============================================================================
# tmux configuration
# ----------------------------------------------------------------------------
# Cheat sheet for the commands used below, since it's easy to reach for the
# wrong one:
#
#   set-option (alias: set) / set-window-option (alias: setw)
#     Change a tmux OPTION. Every option belongs to exactly one scope --
#     server, session, window, or pane -- and tmux infers that scope from
#     the option's name. `-w`/`-p`/`-s` are only needed to force a scope,
#     which really only comes up for plugin-defined `@options` below (their
#     scope is ambiguous, since any name is valid).
#
#       -g   Write the GLOBAL default for that option's scope: all sessions,
#            all windows, or (for pane options) the window-level fallback
#            every pane without its own override inherits. Use this for
#            almost everything in a startup file -- omit it and you're only
#            setting the option on the "current" session/window at the
#            moment tmux.conf is read, so anything created afterwards falls
#            back to tmux's built-in default instead of your value.
#       -a   APPEND to the current value instead of replacing it. Required
#            for options that store tmux's built-in terminal-capability data
#            (terminal-overrides, terminal-features) -- overwriting instead
#            of appending silently deletes tmux's defaults for every other
#            terminal type.
#       -s   Force server scope. tmux already infers this correctly for
#            known server options (default-terminal, escape-time,
#            terminal-features, extended-keys, focus-events, ...); made
#            explicit below wherever the name reads like it could be a
#            session option.
#
#     Gotcha: several `pane-*`-named options (pane-border-style,
#     pane-active-border-style, pane-border-format/lines/status,
#     pane-base-index) are actually WINDOW-scoped -- the name describes what
#     they draw, not where tmux stores the value.
#
#   set-environment
#     Writes to tmux's environment table (what new panes inherit as shell
#     environment) -- not an option table. `-g` writes the default table
#     used by sessions created from now on; it does not reach panes that
#     already exist.
#
#   NAME=value (bare, config-file only)
#     Shorthand tmux accepts for `set-environment -g NAME value` when it
#     appears on its own line. Used below for tmux-fzf, which reads it back
#     as a real environment variable from its script.
#
# Plugins are loaded last (see the bottom of this file) and can override
# any option set above.
# ============================================================================

# ---- Shell & terminal ------------------------------------------------------

# Login shell for new windows/panes (session option).
set -g default-shell /bin/zsh

# Value tmux reports as $TERM inside panes (server option).
set -s default-terminal "tmux-256color"

# Grant true-color (RGB) support two ways: the older terminfo-override
# mechanism, appended (-a) so we don't erase tmux's built-in overrides for
# every other $TERM...
set -as terminal-overrides ",$TERM:RGB"
# ...and the newer named-feature mechanism (tmux >= 3.2), targeted at the
# specific terminals we actually use.
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"

# Fire the escape key immediately instead of waiting to see if it's part of
# a meta/function-key sequence.
set -s escape-time 0

# ---- Claude Code integration ------------------------------------------------
# https://code.claude.com/docs/en/terminal-config#configure-tmux

# Let escape sequences from a program inside a pane bypass tmux entirely.
set -g allow-passthrough on

# Report modified keys (Ctrl/Meta/Shift combos) with full fidelity.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Read by Claude Code to detect true-color support. set-environment (not
# set-option) writes the environment new sessions inherit going forward.
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1

# ---- Windows & panes ---------------------------------------------------------

# Start numbering at 1 instead of 0 -- easier to reach on a keyboard.
set -g base-index 1
setw -g pane-base-index 1

# Keep window numbers contiguous after one is closed.
set -g renumber-windows on

# Rename windows to the running command automatically...
setw -g automatic-rename on
# ...but don't let a program override the window name via escape sequence.
set -g allow-rename off

# Stay attached to another session instead of getting detached when the
# active one is killed.
set -g detach-on-destroy off

# Tell the terminal when a pane gains/loses focus and pass that through to
# programs inside it (e.g. autoread in vim/neovim).
set -s focus-events on

# Dim inactive panes (available in 3.8).
# set -g window-style 'dim'
# set -g window-active-style 'default'

# Enable mouse support: click to select panes/windows, drag to resize.
set -g mouse on

# ---- Status bar: appearance -------------------------------------------------

set -g status-style "fg=#878580,bg=#1C1B1A"
set -g message-style "fg=#CECDC3,bg=#282726,fill=#282726"
set -g status-position top
set -g status-justify left

# Max width reserved for the left/right segments before tmux truncates them.
set -g status-left-length 100
set -g status-right-length 100

set -g status-left  "  #S  "
set -g status-right "  #H "

# ---- Status bar: window tabs -------------------------------------------------

setw -g window-status-separator "#[bg=#282726] "
setw -g window-status-format "#[fg=#878580,bg=#282726] #I:#W "
setw -g window-status-current-format "#[fg=#100F0F,bg=#D0A215,bold] #I:#W "

# ---- Pane borders ------------------------------------------------------------
# NOTE: despite the "pane-" prefix, all of these are WINDOW-scoped options.

set -g pane-border-style "fg=#403E3C,bg=default"
set -g pane-active-border-style "fg=#D0A215,bg=default"
set -g pane-border-lines single
set -g pane-border-status top
set -g pane-border-format "
#{?pane_active,} #{pane_index}\:#{pane_title} #[default]\
#{?#{mouse},#[align=right]#[range=control|9][]#[norange],}"

# Control+click the [] indicator in a pane border to open a quick-action
# menu for that pane.
bind -n MouseDown1Control9 "\
  display-menu -t= -xM -yM -O -T 'Pane: #{pane_index}' \
  '#{?pane_marked,Unmark,Mark}' 'm' { select-pane -m } \
  '#{?window_zoomed_flag,Unzoom,Zoom}' 'z' { resize-pane -Z } \
  'Horizontal Split' 'h' { split-window -h } \
  'Vertical Split' 'v' { split-window -v } \
  '' \
  'Kill' 'X' { kill-pane -t= }"

# ---- Copy mode -----------------------------------------------------------

setw -g mode-keys vi
setw -g copy-mode-line-numbers hybrid

# Use vim-like `v` for selection and `y` for yank.
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection

# ---- Key bindings -----------------------------------------------------------

# Sort the session/window chooser (prefix s / prefix w) by name, matching
# tmux <= 2.9a's default sort order.
bind-key -T prefix s choose-tree -Zs -O name
bind-key -T prefix w choose-tree -Zw -O name

# Popup bindings
# bind -n C-g popup -E -w80% -h80% -d '#{pane_current_path}' "lazygit"

# ---- Plugins -----------------------------------------------------------------
# Managed by TPM (https://github.com/tmux-plugins/tpm), sourced by the `run`
# call at the bottom of this file. `@`-prefixed values are tmux "user
# options" -- since their scope is ambiguous, `-g` here means "global
# session option", the convention TPM plugins expect when reading their own
# configuration back out.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'     # sane baseline defaults
set -g @plugin 'tmux-plugins/tmux-sessionist'   # session management bindings
set -g @plugin 'tmux-plugins/tmux-pain-control' # pane split/nav bindings

# Move/resize panes across tmux and vim splits with the same keys.
set -g @plugin 'mrjones2014/smart-splits.nvim'

set -g @smart-splits_move_left_key  'C-h'
set -g @smart-splits_move_right_key 'C-l'
set -g @smart-splits_move_down_key  'C-j'
set -g @smart-splits_move_up_key    'C-k'

set -g @smart-splits_resize_left_key  'C-left'
set -g @smart-splits_resize_right_key 'C-right'
set -g @smart-splits_resize_down_key  'C-down'
set -g @smart-splits_resize_up_key    'C-up'

set -g @smart-splits_resize_step_size '5'

# fzf-powered session/window/pane picker.
set -g @plugin 'sainnhe/tmux-fzf'
# Shorthand for `set-environment -g` (see legend above) -- tmux-fzf's
# script reads this back as a real environment variable.
TMUX_FZF_SESSION_FORMAT="#{session_windows} windows"
bind -n C-s run-shell -b "$XDG_CONFIG_HOME/tmux/plugins/tmux-fzf/scripts/session.sh switch"

set -g @plugin 'YlanAllouche/tmux-task-monitor'

set -g @plugin 'rickstaa/tmux-notify' # desktop notifications on pane activity

set -g @plugin 'eduwass/tmux-palette' # command palette
set -g @palette-key 'C-Space'
set -g @palette-find-pane-key 'M-f'
set -g @palette-move-pane-key 'M-m'

set -g @plugin 'tmux-plugins/tmux-resurrect' # save/restore sessions across restarts
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes 'opencode claude lazygit opensessions opensessions-si'

run '~/.tmux/plugins/tpm/tpm'
