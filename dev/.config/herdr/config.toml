onboarding = false

[worktrees]
directory = "~/dev/worktrees"

[keys]
goto = "prefix+space"
new_workspace = ["prefix+shift+n", "prefix+shift+c"]
navigate_workspace_up = ["up", "k"]
navigate_workspace_down = ["down", "j"]
split_vertical   = ["prefix+v", "prefix+|", "prefix+backslash"]
split_horizontal = ["prefix+minus", "prefix+_"]

[[keys.command]]
key = "prefix+g"
type = "pane"
command = "lazygit"
description = "run lazygit"

[theme]
name = "vesper" # base theme is irrelevant — every token below is overridden
auto_switch = false

[theme.custom]
# GitHub Dark Default, matched to this repo's existing GitHub colors already
# used by tmux's agent-indicator (red/blue) and tmux-palette's github.json
# (bg/panel/selected/fg/muted/accent). Full scale: GitHub Primer's dark
# "default" tokens.
accent      = "#58A6FF" # blue — highlights, active borders
panel_bg    = "#0D1117" # canvas.default — base background
surface_dim = "#161B22" # canvas.subtle — dim separators
surface0    = "#21262D" # selected/focused surface
surface1    = "#262C36" # hover/active surface
overlay1    = "#8B949E" # fg.muted — brighter overlay text
overlay0    = "#6E7681" # fg.subtle — muted secondary text
text        = "#E6EDF3" # fg.default — main text
subtext0    = "#B1BAC4" # subdued labels
mauve       = "#BC8CFF" # purple — branch/special labels
green       = "#3FB950" # green — done/idle
yellow      = "#D29922" # yellow — working/running
red         = "#F85149" # red — needs attention/blocked
blue        = "#58A6FF" # blue — unseen/done notifications
teal        = "#39C5CF" # cyan — notification accent
peach       = "#FFA657" # orange — interrupted/warning

[ui]
sidebar_width = 48
sidebar_min_width = 16
sidebar_max_width = 64
agent_panel_sort = "spaces"

[ui.toast]
delivery = "herdr"
