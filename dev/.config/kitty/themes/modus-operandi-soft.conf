# vim:ft=kitty
# Modus Operandi Soft (light) -- https://protesilaos.com/emacs/modus-themes
# Colors from miikanissi/modus-themes.nvim extras/kitty, with the background
# lowered one 5% tick (13/255 = 0x0D) off pure white: background,
# active_tab_background, and color15 (ANSI bright white) -> #f2f2f2. Foreground,
# cursor, and accents unchanged. See dev/.config/theming/MODUS-SOFT.md.

background #f2f2f2
foreground #000000
selection_background #dfa0f0
selection_foreground #000000
url_color #193668
cursor #000000
cursor_text_color #ffffff

# Tabs
active_tab_background #f2f2f2
active_tab_foreground #193668
inactive_tab_background #c2c2c2
inactive_tab_foreground #000000

# Windows
active_border_color #3548cf
inactive_border_color #9f9f9f

# normal
color0 #000000
color1 #a60000
color2 #006800
color3 #6f5500
color4 #0031a9
color5 #721045
color6 #005e8b
color7 #a6a6a6

# bright
color8 #595959
color9 #972500
color10 #00663f
color11 #884900
color12 #3548cf
color13 #8f0075
color14 #005f5f
color15 #f2f2f2

# extended colors
color16 #884900
color17 #7f0000
