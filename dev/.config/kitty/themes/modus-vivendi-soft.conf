# vim:ft=kitty
# Modus Vivendi Soft (dark) -- https://protesilaos.com/emacs/modus-themes
# Colors from miikanissi/modus-themes.nvim extras/kitty, with the background
# lifted one 5% tick (13/255 = 0x0D) off pure black: background,
# active_tab_background, and color0 (ANSI black) -> #0d0d0d. Foreground, cursor,
# and accents unchanged. See dev/.config/theming/MODUS-SOFT.md.

background #0d0d0d
foreground #ffffff
selection_background #7030af
selection_foreground #ffffff
url_color #c6daff
cursor #ffffff
cursor_text_color #000000

# Tabs
active_tab_background #0d0d0d
active_tab_foreground #c6daff
inactive_tab_background #545454
inactive_tab_foreground #ffffff

# Windows
active_border_color #79a8ff
inactive_border_color #646464

# normal
color0 #0d0d0d
color1 #ff5f59
color2 #44bc44
color3 #d0bc00
color4 #2fafff
color5 #feacd0
color6 #00d3d0
color7 #a6a6a6

# bright
color8 #595959
color9 #ff6b55
color10 #00c06f
color11 #fec43f
color12 #79a8ff
color13 #f78fe7
color14 #6ae4b9
color15 #ffffff

# extended colors
color16 #fec43f
color17 #ff9580
