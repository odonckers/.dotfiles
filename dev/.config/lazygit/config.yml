gui:
  skipRewordInEditorWarning: true
  nerdFontsVersion: "3"
  border: 'rounded'
os:
  editPreset: 'nvim' # see 'Configuring File Editing' section
git:
  diffRenderers:
    - # delta, themed to match the active theme for the current OS
      # appearance -- see dev/.config/theming/delta-pager.sh
      colorArg: always
      command: ${XDG_CONFIG_HOME:-$HOME/.config}/theming/delta-pager.sh --paging=never
      # ydiff
      # colorArg: never
      # pager: ydiff -p cat -s --wrap --width={{columnWidth}}
  overrideGpg: true
