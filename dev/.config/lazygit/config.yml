gui:
  skipRewordInEditorWarning: true
  nerdFontsVersion: "3"
  border: 'rounded'
os:
  editPreset: 'nvim' # see 'Configuring File Editing' section
git:
  diffRenderers:
    - # delta with its default colors
      colorArg: always
      command: delta --paging=never
      # ydiff
      # colorArg: never
      # pager: ydiff -p cat -s --wrap --width={{columnWidth}}
  overrideGpg: true
worktree:
  defaultPath: "~/dev/worktrees"
