# vim:fileencoding=utf-8:foldmethod=marker

# GitHub Dark Default, hand-written to match the rest of this repo's theming
# (see ../../../theming/themes/github.sh). Structure mirrors the vendored
# rose-pine flavor; colors are GitHub Primer's dark "default" tokens.

# : App {{{

[app]
overall = { bg = "#0d1117" }

# : }}}


# : Manager {{{

[mgr]
cwd = { fg = "#58a6ff" }

# Find
find_keyword  = { fg = "#d29922", bold = true, italic = true, underline = true }
find_position = { fg = "#bc8cff", bg = "reset", bold = true, italic = true }

# Symlink
symlink_target = { italic = true }

# Marker
marker_copied   = { fg = "#3fb950", bg = "#3fb950" }
marker_cut      = { fg = "#f85149", bg = "#f85149" }
marker_marked   = { fg = "#39c5cf", bg = "#39c5cf" }
marker_selected = { fg = "#58a6ff", bg = "#58a6ff" }

# Count
count_copied   = { fg = "#0d1117", bg = "#3fb950" }
count_cut      = { fg = "#0d1117", bg = "#f85149" }
count_selected = { fg = "#0d1117", bg = "#58a6ff" }

# Border
border_symbol = "│"
border_style  = { fg = "#30363d" }

# Highlighting
syntect_theme = ""

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "#0d1117", bg = "#58a6ff", bold = true }
inactive = { fg = "#8b949e", bg = "#21262d" }

# Separator
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# : }}}


# : Mode {{{

[mode]
normal_main = { fg = "#0d1117", bg = "#58a6ff", bold = true }
normal_alt  = { fg = "#e6edf3", bg = "#21262d", bold = true }

# Select mode
select_main = { fg = "#0d1117", bg = "#f85149", bold = true }
select_alt  = { fg = "#e6edf3", bg = "#21262d", bold = true }

# Unset mode
unset_main = { fg = "#0d1117", bg = "#f85149", bold = true }
unset_alt  = { fg = "#e6edf3", bg = "#21262d", bold = true }

# : }}}


# : Indicator of hovered file {{{

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "", close = "" }

# : }}}


# : Status bar {{{

[status]
overall   = { bg = "#0d1117" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_sep   = { fg = "#6e7681" }
perm_type  = { fg = "#bc8cff" }
perm_read  = { fg = "#d29922" }
perm_write = { fg = "#f85149" }
perm_exec  = { fg = "#3fb950" }

# Progress
progress_label  = { fg = "#e6edf3", bold = true }
progress_normal = { fg = "#58a6ff", bg = "#21262d" }
progress_error  = { fg = "#f85149", bg = "#21262d" }

# : }}}


# : Which {{{

[which]
cols            = 3
mask            = { bg = "#161b22" }
cand            = { fg = "#58a6ff" }
rest            = { fg = "#6e7681" }
desc            = { fg = "#d29922" }
separator       = "  "
separator_style = { fg = "#6e7681" }

# : }}}


# : Confirmation {{{

[confirm]
border     = { fg = "#30363d" }
title      = { fg = "#f85149", bold = true }
body       = { fg = "#e6edf3" }
list       = { fg = "#e6edf3" }
btn_yes    = { fg = "#0d1117", bg = "#58a6ff", bold = true }
btn_no     = { fg = "#e6edf3", bg = "#21262d", bold = true }
btn_labels = [ "  [y]es  ", "  (n)o  " ]

# : }}}


# : Spotter {{{

[spot]
border = { fg = "#30363d" }
title  = { fg = "#58a6ff", bold = true }

# Table
tbl_col  = { fg = "#58a6ff" }
tbl_cell = { fg = "#0d1117", bg = "#d29922", bold = true }

# : }}}


# : Notification {{{

[notify]
title_info  = { fg = "#3fb950" }
title_warn  = { fg = "#d29922" }
title_error = { fg = "#f85149" }

# Icons
icon_info  = ""
icon_warn  = ""
icon_error = ""

# : }}}


# : Picker {{{

[pick]
border   = { fg = "#58a6ff" }
active   = { fg = "#bc8cff", bold = true }
inactive = { fg = "#8b949e" }

# : }}}


# : Input {{{

[input]
border   = { fg = "#58a6ff" }
title    = { bold = true }
value    = { fg = "#e6edf3" }
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border   = { fg = "#58a6ff" }
active   = { bg = "#58a6ff", fg = "#0d1117", bold = true }
inactive = { fg = "#8b949e" }

# Icons
icon_file    = ""
icon_folder  = ""
icon_command = ""

# : }}}


# : Task manager {{{

[tasks]
border  = { fg = "#58a6ff" }
title   = { bold = true }
hovered = { fg = "#bc8cff", bold = true, reversed = true }

# : }}}


# : Help menu {{{

[help]
on      = { fg = "#58a6ff" }
run     = { fg = "#bc8cff" }
desc    = { fg = "#d29922" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#0d1117", bg = "#e6edf3" }

# : }}}


# : File-specific styles {{{

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#bc8cff" },

  # Media
  { mime = "{audio,video}/*", fg = "#d29922" },

  # Archives
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f85149" },

  # Documents
  { mime = "application/{pdf,doc,rtf}", fg = "#ffa657" },

  # Empty files
  # { mime = "inode/empty", fg = "#f85149" },

  # Special files
  { url = "*", is = "orphan", fg = "#0d1117", bg = "#f85149" },
  { url = "*", is = "exec", fg = "#3fb950" },

  # Dummy files
  { url = "*", is = "dummy", fg = "#0d1117", bg = "#f85149" },
  { url = "*/", is = "dummy", fg = "#0d1117", bg = "#f85149" },

  # Fallback
  { url = "*", fg = "#e6edf3" },
  { url = "*/", fg = "#58a6ff" }
]

# : }}}
