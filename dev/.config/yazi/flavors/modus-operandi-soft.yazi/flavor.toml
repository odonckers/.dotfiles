# vim:fileencoding=utf-8:foldmethod=marker
# Modus Operandi Soft (light) -- https://protesilaos.com/emacs/modus-themes
# Accent is Modus's canonical blue (#0031a9). Backgrounds lowered one 5% tick
# (13/255 = 0x0D) off pure white; text and accents unchanged. See
# dev/.config/theming/MODUS-SOFT.md.

# : App {{{

[app]
overall = { bg = "#f2f2f2" }

# : }}}


# : Manager {{{

[mgr]
cwd = { fg = "#0031a9" }

# Find
find_keyword  = { fg = "#6f5500", bold = true, underline = true }
find_position = { fg = "#721045", bg = "reset", bold = true }

# Symlink
symlink_target = {}

# Marker
marker_copied   = { fg = "#006800", bg = "#006800" }
marker_cut      = { fg = "#a60000", bg = "#a60000" }
marker_marked   = { fg = "#721045", bg = "#721045" }
marker_selected = { fg = "#0031a9", bg = "#0031a9" }

# Count
count_copied   = { fg = "#ffffff", bg = "#006800" }
count_cut      = { fg = "#ffffff", bg = "#a60000" }
count_selected = { fg = "#ffffff", bg = "#0031a9" }

# Border
border_symbol = "│"
border_style  = { fg = "#9f9f9f" }

# Highlighting
syntect_theme = ""

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "#ffffff", bg = "#0031a9", bold = true }
inactive = { fg = "#000000", bg = "#d3d3d3" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# : }}}


# : Mode {{{

[mode]
normal_main = { fg = "#ffffff", bg = "#0031a9", bold = true }
normal_alt  = { fg = "#000000", bg = "#d3d3d3", bold = true }

select_main = { fg = "#ffffff", bg = "#721045", bold = true }
select_alt  = { fg = "#000000", bg = "#d3d3d3", bold = true }

unset_main = { fg = "#ffffff", bg = "#6f5500", bold = true }
unset_alt  = { fg = "#000000", bg = "#d3d3d3", bold = true }

# : }}}


# : Indicator of hovered file {{{

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "", close = "" }

# : }}}


# : Status bar {{{

[status]
overall   = { bg = "#f2f2f2" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_sep   = { fg = "#595959" }
perm_type  = { fg = "#0031a9" }
perm_read  = { fg = "#6f5500" }
perm_write = { fg = "#a60000" }
perm_exec  = { fg = "#006800" }

# Progress
progress_label  = { fg = "#000000", bold = true }
progress_normal = { fg = "#0031a9", bg = "#e5e5e5" }
progress_error  = { fg = "#a60000", bg = "#e5e5e5" }

# : }}}


# : Which {{{

[which]
cols            = 3
mask            = { bg = "#e5e5e5" }
cand            = { fg = "#0031a9" }
rest            = { fg = "#595959" }
desc            = { fg = "#6f5500" }
separator       = "  "
separator_style = { fg = "#595959" }

# : }}}


# : Confirmation {{{

[confirm]
border     = { fg = "#9f9f9f" }
title      = { fg = "#a60000", bold = true }
body       = { fg = "#000000" }
list       = { fg = "#000000" }
btn_yes    = { fg = "#ffffff", bg = "#0031a9", bold = true }
btn_no     = { fg = "#000000", bg = "#d3d3d3", bold = true }
btn_labels = [ "  [y]es  ", "  (n)o  " ]

# : }}}


# : Spotter {{{

[spot]
border = { fg = "#9f9f9f" }
title  = { fg = "#0031a9", bold = true }

tbl_col  = { fg = "#0031a9" }
tbl_cell = { fg = "#ffffff", bg = "#6f5500", bold = true }

# : }}}


# : Notification {{{

[notify]
title_info  = { fg = "#0031a9" }
title_warn  = { fg = "#6f5500" }
title_error = { fg = "#a60000" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

# : }}}


# : Picker {{{

[pick]
border   = { fg = "#0031a9" }
active   = { fg = "#721045", bold = true }
inactive = { fg = "#595959" }

# : }}}


# : Input {{{

[input]
border   = { fg = "#0031a9" }
title    = { bold = true }
value    = { fg = "#000000" }
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border   = { fg = "#0031a9" }
active   = { bg = "#000000", fg = "#ffffff", bold = true }
inactive = { fg = "#595959" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

# : }}}


# : Task manager {{{

[tasks]
border  = { fg = "#0031a9" }
title   = { bold = true }
hovered = { fg = "#721045", bold = true, reversed = true }

# : }}}


# : Help menu {{{

[help]
on      = { fg = "#0031a9" }
run     = { fg = "#721045" }
desc    = { fg = "#6f5500" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#ffffff", bg = "#000000" }

# : }}}


# : File-specific styles {{{

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#005e8b" },

  # Media
  { mime = "{audio,video}/*", fg = "#6f5500" },

  # Archives
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#721045" },

  # Documents
  { mime = "application/{pdf,doc,rtf}", fg = "#005e8b" },

  # Special files
  { url = "*", is = "orphan", fg = "#ffffff", bg = "#a60000" },
  { url = "*", is = "exec", fg = "#006800" },

  # Dummy files
  { url = "*", is = "dummy", fg = "#ffffff", bg = "#a60000" },
  { url = "*/", is = "dummy", fg = "#ffffff", bg = "#a60000" },

  # Fallback
  { url = "*", fg = "#000000" },
  { url = "*/", fg = "#0031a9" }
]

# : }}}
