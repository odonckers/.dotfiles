# vim:fileencoding=utf-8:foldmethod=marker
# Modus Vivendi (dark) -- https://protesilaos.com/emacs/modus-themes
# Accent is Modus's canonical blue (#2fafff).

# : App {{{

[app]
overall = { bg = "#000000" }

# : }}}


# : Manager {{{

[mgr]
cwd = { fg = "#2fafff" }

# Find
find_keyword  = { fg = "#d0bc00", bold = true, underline = true }
find_position = { fg = "#feacd0", bg = "reset", bold = true }

# Symlink
symlink_target = {}

# Marker
marker_copied   = { fg = "#44bc44", bg = "#44bc44" }
marker_cut      = { fg = "#ff5f59", bg = "#ff5f59" }
marker_marked   = { fg = "#feacd0", bg = "#feacd0" }
marker_selected = { fg = "#2fafff", bg = "#2fafff" }

# Count
count_copied   = { fg = "#000000", bg = "#44bc44" }
count_cut      = { fg = "#000000", bg = "#ff5f59" }
count_selected = { fg = "#000000", bg = "#2fafff" }

# Border
border_symbol = "│"
border_style  = { fg = "#646464" }

# Highlighting
syntect_theme = ""

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "#000000", bg = "#2fafff", bold = true }
inactive = { fg = "#ffffff", bg = "#303030" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# : }}}


# : Mode {{{

[mode]
normal_main = { fg = "#000000", bg = "#2fafff", bold = true }
normal_alt  = { fg = "#ffffff", bg = "#303030", bold = true }

select_main = { fg = "#000000", bg = "#feacd0", bold = true }
select_alt  = { fg = "#ffffff", bg = "#303030", bold = true }

unset_main = { fg = "#000000", bg = "#d0bc00", bold = true }
unset_alt  = { fg = "#ffffff", bg = "#303030", bold = true }

# : }}}


# : Indicator of hovered file {{{

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "", close = "" }

# : }}}


# : Status bar {{{

[status]
overall   = { bg = "#000000" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_sep   = { fg = "#989898" }
perm_type  = { fg = "#2fafff" }
perm_read  = { fg = "#d0bc00" }
perm_write = { fg = "#ff5f59" }
perm_exec  = { fg = "#44bc44" }

# Progress
progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#2fafff", bg = "#1e1e1e" }
progress_error  = { fg = "#ff5f59", bg = "#1e1e1e" }

# : }}}


# : Which {{{

[which]
cols            = 3
mask            = { bg = "#1e1e1e" }
cand            = { fg = "#2fafff" }
rest            = { fg = "#989898" }
desc            = { fg = "#d0bc00" }
separator       = "  "
separator_style = { fg = "#989898" }

# : }}}


# : Confirmation {{{

[confirm]
border     = { fg = "#646464" }
title      = { fg = "#ff5f59", bold = true }
body       = { fg = "#ffffff" }
list       = { fg = "#ffffff" }
btn_yes    = { fg = "#000000", bg = "#2fafff", bold = true }
btn_no     = { fg = "#ffffff", bg = "#303030", bold = true }
btn_labels = [ "  [y]es  ", "  (n)o  " ]

# : }}}


# : Spotter {{{

[spot]
border = { fg = "#646464" }
title  = { fg = "#2fafff", bold = true }

tbl_col  = { fg = "#2fafff" }
tbl_cell = { fg = "#000000", bg = "#d0bc00", bold = true }

# : }}}


# : Notification {{{

[notify]
title_info  = { fg = "#2fafff" }
title_warn  = { fg = "#d0bc00" }
title_error = { fg = "#ff5f59" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

# : }}}


# : Picker {{{

[pick]
border   = { fg = "#2fafff" }
active   = { fg = "#feacd0", bold = true }
inactive = { fg = "#989898" }

# : }}}


# : Input {{{

[input]
border   = { fg = "#2fafff" }
title    = { bold = true }
value    = { fg = "#ffffff" }
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border   = { fg = "#2fafff" }
active   = { bg = "#ffffff", fg = "#000000", bold = true }
inactive = { fg = "#989898" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

# : }}}


# : Task manager {{{

[tasks]
border  = { fg = "#2fafff" }
title   = { bold = true }
hovered = { fg = "#feacd0", bold = true, reversed = true }

# : }}}


# : Help menu {{{

[help]
on      = { fg = "#2fafff" }
run     = { fg = "#feacd0" }
desc    = { fg = "#d0bc00" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#000000", bg = "#ffffff" }

# : }}}


# : File-specific styles {{{

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#00d3d0" },

  # Media
  { mime = "{audio,video}/*", fg = "#d0bc00" },

  # Archives
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#feacd0" },

  # Documents
  { mime = "application/{pdf,doc,rtf}", fg = "#00d3d0" },

  # Special files
  { url = "*", is = "orphan", fg = "#000000", bg = "#ff5f59" },
  { url = "*", is = "exec", fg = "#44bc44" },

  # Dummy files
  { url = "*", is = "dummy", fg = "#000000", bg = "#ff5f59" },
  { url = "*/", is = "dummy", fg = "#000000", bg = "#ff5f59" },

  # Fallback
  { url = "*", fg = "#ffffff" },
  { url = "*/", fg = "#2fafff" }
]

# : }}}
